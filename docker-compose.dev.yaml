# Desarrollo: solo la base y el bucket. la api y el front se corren a mano (ver README).
# Uso: docker compose -f docker-compose.dev.yaml up -d
# (docker-compose.yml es el de produccion y levanta todo)
services:
  db:
    image: postgres:16-alpine
    #labajada-db para no chocar con otros contenedores "db" de la compu
    container_name: labajada-db
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      #hora de Uruguay para el servidor (logs y valor por defecto). la zona de la base
      #tambien la fija db/01_schema.sql, asi las fechas no quedan corridas
      TZ: America/Montevideo
      PGTZ: America/Montevideo
    #PGPORT del .env (5438 por defecto, para no chocar con un Postgres del sistema en 5432)
    ports:
      - "${PGPORT:-5438}:5432"
    volumes:
      #corre los .sql de /db en orden alfabetico (01_schema, 02_triggers, 03_seed) la primera vez que se crea la base
      - ./db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  #bucket de imagenes de productos (ver bucket/server.js). la api le sube los archivos
  #con BUCKET_TOKEN y el front los muestra via el proxy /bucket de ng serve
  bucket:
    build: ./bucket
    container_name: bucket
    environment:
      #mismo valor que usa la api (.env). el default es solo para desarrollo
      BUCKET_TOKEN: ${BUCKET_TOKEN:-dev-bucket-token}
      BUCKET_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - bucketdata:/data

volumes:
  pgdata:
  bucketdata:
