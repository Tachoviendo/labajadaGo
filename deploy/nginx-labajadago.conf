# nginx del servidor para labajadago.graph.uy
# Todo va al contenedor del front (FRONTEND_PORT=8080), que a su vez reparte /api y /bucket.
#
# Instalacion (como root en el droplet):
#   cp deploy/nginx-labajadago.conf /etc/nginx/sites-available/labajadago
#   ln -s /etc/nginx/sites-available/labajadago /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d labajadago.graph.uy      # agrega el bloque 443 y la redireccion

server {
    listen 80;
    listen [::]:80;
    server_name labajadago.graph.uy;

    access_log /var/log/nginx/labajadago_access.log;
    error_log /var/log/nginx/labajadago_error.log;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # websocket del seguimiento del delivery (/api/pedidos/:id/seguimiento)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
