<ion-app>
  <ion-menu contentId="contenido-principal">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>La Bajada GO</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      @if (usuario(); as usuario) {
        <ion-item lines="full">
          <ion-label>
            <h2>{{ usuario.nombre }}</h2>
            <p>{{ usuario.rol }}</p>
          </ion-label>
        </ion-item>
      }

      <ion-list>
        <!-- los links siguen los mismos roles que los guards de las rutas -->
        @for (link of links(); track link.url) {
          <ion-menu-toggle [autoHide]="false">
            <ion-item
              button
              detail="false"
              [routerLink]="link.url"
              routerLinkActive="link-activo"
              [routerLinkActiveOptions]="{ exact: link.url === '/' }"
            >
              <ion-icon slot="start" [name]="link.icono" aria-hidden="true" />
              <ion-label>{{ link.texto }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }

        @if (usuario()) {
          <ion-menu-toggle [autoHide]="false">
            <ion-item button detail="false" (click)="cerrarSesion()">
              <ion-icon slot="start" name="log-out-outline" aria-hidden="true" />
              <ion-label>Cerrar sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }
      </ion-list>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="contenido-principal">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-buttons slot="start">
          <ion-menu-button />
        </ion-buttons>
        <ion-title>La Bajada GO</ion-title>
        @if (usuario()?.rol === 'cliente') {
          <ion-buttons slot="end">
            <ion-button routerLink="/carrito" aria-label="Ver carrito">
              <ion-icon slot="icon-only" name="cart-outline" />
            </ion-button>
          </ion-buttons>
        }
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <router-outlet />
    </ion-content>
  </div>
</ion-app>
