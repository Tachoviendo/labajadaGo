#nginx del contenedor del front (produccion). hace lo mismo que el proxy de ng serve
#(proxy.conf.json), asi environment.ts sigue usando /api y /bucket relativos:
#  /api    -> contenedor backend (incluido el websocket del seguimiento)
#  /bucket -> contenedor bucket, sin el prefijo
#  resto   -> el build de Angular; las rutas sin archivo devuelven index.html

#websocket: si el pedido trae "Upgrade" se manda "Connection: upgrade", si no se cierra normal
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    #fotos de entrega hasta 5 MB + lo que agrega el multipart
    client_max_body_size 6m;

    #el mime.types de nginx no trae .webmanifest (saldria como octet-stream)
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1000;

    #DNS interno de docker. con la direccion en una variable nginx vuelve a resolver el nombre,
    #asi no queda apuntando a la IP vieja cuando el deploy recrea el backend o el bucket
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;
    set $bucket http://bucket:3001;

    #^~: estos prefijos le ganan a las locations con regex de abajo (si no, /bucket/x.png
    #lo agarraria la de imagenes y buscaria el archivo en el build -> 404)
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #el websocket del seguimiento puede estar abierto un buen rato sin mensajes
        proxy_read_timeout 1h;
    }

    location ^~ /bucket/ {
        rewrite ^/bucket/(.*)$ /$1 break;
        proxy_pass $bucket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    #la PWA tiene que enterarse rapido de un deploy nuevo: estos nunca se cachean
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    #el build de produccion lleva hash en el nombre de js y css: se pueden cachear para siempre
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
